# ─── Render Blueprint ──────────────────────────────────────────────────────
# Deploy da plataforma Roda da Vida com SQLite persistente
# Documentação: https://render.com/docs/blueprint-spec
#
# Como usar:
#   1. Faça push deste repositório para o GitHub
#   2. No Render Dashboard → New → Blueprint (ou conectar o repo)
#   3. Render detecta este render.yaml e configura automaticamente
#   4. Vá em Dashboard → seu serviço → Disks → anota o mount path
#   5. Acesse o serviço, primeiro deploy já cria o banco

services:
  - type: web
    name: roda-da-vida
    env: node
    region: ohio  # ou sao-paulo (South America) se disponível
    plan: free
    buildCommand: npx prisma generate && npm run build
    startCommand: sh -c 'npx prisma db push && npx prisma db seed && npm run start'
    healthCheckPath: /

    # ─── Banco SQLite persistente ──────────────────────────────────────
    # Disk montado como /data — o banco fica seguro entre deploys
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

    # ─── Variáveis de ambiente ─────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/dev.db
      - key: AUTH_SECRET
        generateValue: true
