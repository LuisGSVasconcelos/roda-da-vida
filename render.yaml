# ─── Render Blueprint ──────────────────────────────────────────────────────
# Deploy da plataforma Roda da Vida com Turso (SQLite na nuvem)
# Documentação: https://render.com/docs/blueprint-spec
#
# Como usar:
#   1. Crie uma database no Turso: https://turso.tech
#   2. Defina as env vars no Render Dashboard (ou aqui no render.yaml)
#   3. Faça push — o Render faz o deploy automaticamente

services:
  - type: web
    name: roda-da-vida
    env: node
    region: ohio  # ou sao-paulo (South America)
    plan: free
    buildCommand: npx prisma generate && npm run build
    startCommand: sh -c 'npx tsx scripts/init-turso.ts && npm run start'
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # definir no dashboard do Render
      - key: AUTH_SECRET
        generateValue: true
